# Desenvolvimento local (build das imagens a partir do código; portas publicadas).
# Produção/Dokploy: docker-compose.prod.yml
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dynamix
      POSTGRES_PASSWORD: dynamix
      POSTGRES_DB: dynamix
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dynamix"]
      interval: 5s
      retries: 10

  # Fork comunitário do MinIO (com a consola web restaurada)
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: dynamix
      MINIO_ROOT_PASSWORD: dynamix-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  # Backups automáticos de Postgres + MinIO (ver docs/backups.md)
  backup:
    build: ./apps/backup
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_started }
    environment:
      PGHOST: postgres
      PGUSER: dynamix
      PGPASSWORD: dynamix
      PGDATABASE: dynamix
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: dynamix
      S3_SECRET_KEY: dynamix-secret
      S3_BUCKET: dynamix-media
      BACKUP_TOKEN: ${BACKUP_TOKEN:-dev-backup-token-change-me}
      BACKUP_TIMES: ${BACKUP_TIMES:-03:00}
    volumes: [backups:/backups]

  api:
    build:
      context: ./apps/api
      args: { APP_VERSION: dev }
    depends_on:
      migrate: { condition: service_completed_successfully }
    environment: &api-env
      PORT: 3001
      DATABASE_URL: postgresql://dynamix:dynamix@postgres:5432/dynamix
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRES_IN: 7d
      WEB_URL: http://localhost:5173
      API_PUBLIC_URL: http://localhost:3001
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: dynamix
      S3_SECRET_KEY: dynamix-secret
      S3_BUCKET: dynamix-media
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      BACKUP_URL: http://backup:8081
      BACKUP_TOKEN: ${BACKUP_TOKEN:-dev-backup-token-change-me}
      APP_VERSION: dev
    ports: ["3001:3001"]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3001/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      retries: 10

  # One-shot: [backup se há migrações pendentes] → prisma migrate deploy → seed. A API só arranca se isto terminar OK.
  migrate:
    build:
      context: ./apps/api
      args: { APP_VERSION: dev }
    command: ["node", "dist/predeploy.js"]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }
      backup: { condition: service_started }
    environment:
      <<: *api-env
      PREDEPLOY_BACKUP: ${PREDEPLOY_BACKUP:-auto}

  frontend:
    build:
      context: ./apps/frontend
      args:
        VITE_API_URL: http://localhost:3001/api/v1
    depends_on: [api]
    ports: ["5173:80"]

volumes:
  pgdata:
  miniodata:
  backups:
