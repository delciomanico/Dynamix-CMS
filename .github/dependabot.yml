version: 2
updates:
  - { package-ecosystem: npm, directory: /apps/api, schedule: { interval: weekly }, groups: { minor-patch: { update-types: [minor, patch] } } }
  - { package-ecosystem: npm, directory: /apps/frontend, schedule: { interval: weekly }, groups: { minor-patch: { update-types: [minor, patch] } } }
  # imagens base (node, nginx, postgres, minio): inclui correções de segurança do Node
  - { package-ecosystem: docker, directory: /apps/api, schedule: { interval: weekly } }
  - { package-ecosystem: docker, directory: /apps/frontend, schedule: { interval: weekly } }
  - { package-ecosystem: docker, directory: /apps/backup, schedule: { interval: weekly } }
  - { package-ecosystem: github-actions, directory: /, schedule: { interval: weekly } }
