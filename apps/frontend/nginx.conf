server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 51m;   # uploads até 10 MB (vídeos 50 MB) + overhead multipart

  # Proxy para a API: um único domínio serve frontend + API (sem CORS entre origens).
  # Resolução dinâmica: o nginx arranca mesmo que a API ainda não esteja pronta.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api http://api:3001;
  location ~ ^/(api|docs) {
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 60s;
  }

  # SPA: rotas do React Router
  location / { try_files $uri /index.html; }
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
  add_header X-Content-Type-Options nosniff;
  add_header X-Frame-Options DENY;
}
