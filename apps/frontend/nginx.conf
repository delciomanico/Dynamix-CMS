# Crawlers e pré-visualizações sociais (não executam JavaScript) recebem HTML com meta/JSON-LD gerado pela API.
# Esquema público (atrás de proxy TLS o pedido chega em http): usa X-Forwarded-Proto quando existe.
map $http_x_forwarded_proto $site_scheme { default $http_x_forwarded_proto; '' $scheme; }

map $http_user_agent $seo_bot {
  default 0;
  ~*(googlebot|bingbot|duckduckbot|yandex|baiduspider|facebookexternalhit|twitterbot|linkedinbot|whatsapp|telegrambot|slackbot|discordbot|pinterest|applebot) 1;
}

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 51m;   # uploads até 10 MB (vídeos 50 MB) + overhead multipart

  # Proxy para a API: um único domínio serve frontend + API (sem CORS entre origens).
  # Resolução dinâmica: o nginx arranca mesmo que a API ainda não esteja pronta.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api http://dynamix-api:3001;   # alias único da API (ver docker-compose*.yml)
  location ~ ^/api {
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 60s;
  }

  # SEO: robots.txt e sitemap.xml (dinâmico: inclui blogs e artigos publicados)
  location = /robots.txt { proxy_pass $api/api/v1/seo/robots; }
  location = /sitemap.xml { proxy_pass $api/api/v1/seo/sitemap; }

  # Blogs públicos (/b/:blog e /b/:blog/:artigo): bots recebem o HTML pré-gerado; os utilizadores recebem a SPA.
  location ~ ^/b/([^/]+)(?:/([^/]+))?/?$ {
    if ($seo_bot) { rewrite ^/b/([^/]+)(?:/([^/]+))?/?$ /api/v1/seo/page/$1/$2 last; }
    sub_filter '%SITE_URL%' '$site_scheme://$host';
    sub_filter_once off;
    try_files $uri /index.html;
  }

  # Swagger não existe em produção
  location = /docs { return 404; }
  location /docs/ { return 404; }

  # SPA: rotas do React Router. O domínio público entra nas meta tags (canonical/og) via %SITE_URL%.
  location / {
    sub_filter '%SITE_URL%' '$site_scheme://$host';
    sub_filter_once off;
    try_files $uri /index.html;
  }
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
  add_header X-Content-Type-Options nosniff;
  add_header X-Frame-Options DENY;
}
