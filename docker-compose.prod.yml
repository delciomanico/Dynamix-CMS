# Produção / Dokploy — usa IMAGENS IMUTÁVEIS construídas e testadas pelo CI (ver docs/updates.md).
# Sem portas no host: o Traefik do Dokploy encaminha o domínio para `frontend:80`, que serve o site
# e faz proxy de /api e /docs. Variáveis obrigatórias: ver .env.production.example
# Build no próprio servidor (sem registry): docker compose -f docker-compose.prod.yml -f docker-compose.build.yml up -d --build
name: dynamix-cms

x-api-env: &api-env
  NODE_ENV: production
  PORT: 3001
  TRUST_PROXY_HOPS: 2             # Traefik + nginx (rate limit por IP real)
  DATABASE_URL: postgresql://dynamix:${POSTGRES_PASSWORD}@postgres:5432/dynamix
  JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET (>= 32 caracteres)}
  JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
  WEB_URL: ${PUBLIC_URL:?defina PUBLIC_URL, ex. https://cms.exemplo.com}
  API_PUBLIC_URL: ${PUBLIC_URL}
  S3_ENDPOINT: http://minio:9000
  S3_REGION: us-east-1
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-dynamix}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?defina S3_SECRET_KEY}
  S3_BUCKET: ${S3_BUCKET:-dynamix-media}
  ADMIN_EMAIL: ${ADMIN_EMAIL:?defina ADMIN_EMAIL}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:?defina ADMIN_PASSWORD}
  ADMIN_NAME: ${ADMIN_NAME:-Administrador}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  BACKUP_URL: http://backup:8081
  BACKUP_TOKEN: ${BACKUP_TOKEN:?defina BACKUP_TOKEN (>= 16 caracteres)}
  # Seed de sites (ver docs/seeds.md)
  SEED_SITES: ${SEED_SITES:-bchiwale}
  SEED_BCHIWALE_ORIGINS: ${SEED_BCHIWALE_ORIGINS:-}
  SEED_BCHIWALE_URL: ${SEED_BCHIWALE_URL:-}
  SEED_BCHIWALE_OWNER_EMAIL: ${SEED_BCHIWALE_OWNER_EMAIL:-}
  SEED_BCHIWALE_OWNER_PASSWORD: ${SEED_BCHIWALE_OWNER_PASSWORD:-}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dynamix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: dynamix
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dynamix"]
      interval: 5s
      retries: 10

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-dynamix}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?defina S3_SECRET_KEY}
    volumes: [miniodata:/data]

  backup:
    image: ${IMAGE_PREFIX:-ghcr.io/delciomanico/dynamix-cms}-backup:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_started }
    environment:
      PGHOST: postgres
      PGUSER: dynamix
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: dynamix
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-dynamix}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-dynamix-media}
      BACKUP_TOKEN: ${BACKUP_TOKEN}
      BACKUP_TIMES: ${BACKUP_TIMES:-03:00}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-7}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-4}
      BACKUP_KEEP_MONTHLY: ${BACKUP_KEEP_MONTHLY:-6}
      BACKUP_KEEP_SAFETY: ${BACKUP_KEEP_SAFETY:-5}
      # Offsite opcional (qualquer S3/B2/R2/SFTP suportado pelo rclone) — ver docs/backups.md
      BACKUP_OFFSITE: ${BACKUP_OFFSITE:-}
      RCLONE_CONFIG_OFFSITE_TYPE: ${RCLONE_CONFIG_OFFSITE_TYPE:-}
      RCLONE_CONFIG_OFFSITE_PROVIDER: ${RCLONE_CONFIG_OFFSITE_PROVIDER:-}
      RCLONE_CONFIG_OFFSITE_ENDPOINT: ${RCLONE_CONFIG_OFFSITE_ENDPOINT:-}
      RCLONE_CONFIG_OFFSITE_REGION: ${RCLONE_CONFIG_OFFSITE_REGION:-}
      RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID: ${RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY: ${RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY:-}
    volumes: [backups:/backups]

  # One-shot por deploy: backup (se há migrações pendentes) → migrate deploy → seed. Falhou ⇒ a API nova não arranca.
  migrate:
    image: ${IMAGE_PREFIX:-ghcr.io/delciomanico/dynamix-cms}-api:${IMAGE_TAG:-latest}
    pull_policy: always
    command: ["node", "dist/predeploy.js"]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }
      backup: { condition: service_started }
      minio: { condition: service_started }  # o seed envia imagens/vídeo para a Media Library
    environment:
      <<: *api-env
      PREDEPLOY_BACKUP: ${PREDEPLOY_BACKUP:-required}

  api:
    image: ${IMAGE_PREFIX:-ghcr.io/delciomanico/dynamix-cms}-api:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
    environment: *api-env
    expose: ["3001"]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3001/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    image: ${IMAGE_PREFIX:-ghcr.io/delciomanico/dynamix-cms}-frontend:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    expose: ["80"]

volumes:
  pgdata:
  miniodata:
  backups:
